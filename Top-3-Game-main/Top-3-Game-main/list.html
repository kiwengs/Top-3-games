<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List | Top 3 Game Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="icon" type="image/jpg" href="../Image/ICON.jpg" />
    <link rel="stylesheet" href="css/genre.css" />
    <link rel="stylesheet" href="css/list.css" />
  </head>
  <body>
    <header>
      <nav class="navbar" id="navbar">
        <div class="logo">
          <h3>TOP 3 GAME HUB</h3>
        </div>
        <ul id="navLinks">
          <li><a href="Home.html">Home</a></li>
          <li><a href="Trending.html">Trending</a></li>
          <li><a href="list.html" class="active">List</a></li>
          <li><a href="genre.html">Genres</a></li>
          <li><a href="About.html">About</a></li>
        </ul>
        <div class="nav-right">
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>

          <div class="search-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="input-box" placeholder="Search Games..." autocomplete="off" />
            <div class="result-box"></div>
          </div>
        </div>
      </nav>
      <script src="js/ListGameAll.js"></script>
      <script src="js/searchbar.js"></script>
    </header>

    <main class="list-page">
      <section class="list-hero">
        <span class="eyebrow">GAME DIRECTORY</span>
        <h1 id="list-page-title">List Game</h1>
        <p id="list-page-subtitle">
          Jelajahi daftar game yang tersedia di katalog kami, disusun berdasarkan urutan abjad untuk memudahkan pencarian.
        </p>
      </section>

      <div class="filter-toolbar" aria-label="Sort and filter game list">
        <button class="filter-btn active" data-sort="az" type="button">A–Z</button>
        <button class="filter-btn" data-sort="za" type="button">Z–A</button>
      </div>

      <section class="list-grid" id="game-list-az"></section>
    </main>
  </body>
</html>
